<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShotLog — School Photography</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050505">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .animate-fade-in {
      animation: fadeIn .45s cubic-bezier(.16,1,.3,1) forwards;
    }

    .glass {
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.11);
      box-shadow:
        0 20px 70px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.055);
      backdrop-filter: blur(22px) saturate(120%);
      -webkit-backdrop-filter: blur(22px) saturate(120%);
    }

    .glass-soft {
      background: rgba(255,255,255,.025);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .glass-input {
      background:
        linear-gradient(135deg, rgba(255,255,255,.055), rgba(255,255,255,.018)),
        rgba(8,8,8,.34);
      border: 1px solid rgba(255,255,255,.105);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.045),
        0 8px 30px rgba(0,0,0,.16);
      backdrop-filter: blur(18px) saturate(125%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      color-scheme: dark;
      font-family: inherit;
    }

    .glass-input:hover {
      background:
        linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02)),
        rgba(8,8,8,.38);
      border-color: rgba(255,255,255,.15);
    }

    .glass-input:focus {
      background:
        linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.025)),
        rgba(8,8,8,.42);
      border-color: rgba(255,255,255,.42);
      box-shadow: 0 0 0 3px rgba(255,255,255,.055);
    }

    .glass-input::placeholder {
      color: rgba(161,161,170,.58);
    }

    .glass-input[type="date"] {
      color-scheme: dark;
    }

    .glass-input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: .58;
      cursor: pointer;
      padding: 2px;
    }

    .time-select {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      outline: 0;
      cursor: pointer;
      min-width: 0;
      color: rgba(228,228,231,.92);
    }

    .time-select option,
    select.glass-input option {
      background: #111;
      color: #f4f4f5;
    }

    .glass-form-section {
      position: relative;
      overflow: hidden;
    }

    .glass-form-section::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        115deg,
        rgba(255,255,255,.035),
        transparent 35%,
        rgba(255,255,255,.018) 70%,
        transparent
      );
      pointer-events: none;
    }

    .form-field-label {
      display: block;
      margin: 0 0 .4rem .25rem;
      color: rgba(161,161,170,.65);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .modal-backdrop {
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    ::selection { background: rgba(255,255,255,.22); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 999px; }
  </style>
</head>

<body class="bg-[#030303] text-zinc-100 min-h-screen p-4 md:p-8 font-sans relative overflow-x-hidden antialiased">

   <!-- Form -->
<form id="eventForm" class="glass glass-form-section rounded-3xl p-4 sm:p-6 space-y-5">
  <div class="flex justify-between items-center pb-2 border-b border-white/5">

    </div>
    <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-zinc-400 hover:text-white transition underline">
      Cancel Edit

  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 relative z-10">

    <!-- Event Type & Department -->

      <select id="eventType" class="glass-input w-full rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none transition">
        <option value="School Activity">School Activity</option>
        <option value="Graduation">Graduation</option>
        <option value="Sports">Sports</option>
        <option value="Seminar">Seminar</option>
        <option value="Program">Program</option>
        <option value="Performance">Performance</option>
        <option value="Organization Event">Organization Event</option>
        <option value="Celebration">Celebration</option>
        <option value="Portrait Session">Portrait Session</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div>
      <label class="form-field-label">Organization / Department</label>
      <input type="text" id="organization" placeholder="e.g. CCIS"

    <!-- Date & Time -->

        <div class="flex items-center gap-1 flex-1 min-w-0">

            <option>20</option><option>25</option><option>30</option><option>35</option>

    <!-- Filters -->

  <!-- Event Details Modal -->

  <script>
    const SUPABASE_URL = 'https://mfgifshxxikabamzoatf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7_V6DnFz8WDy9bMk9weVFg_7nHLZtsQ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('eventForm');
    const eventsList = document.getElementById('eventsList');

    let allEvents = [];
    let currentFilter = 'all';
    let editingId = null;
    let searchTerm = '';

    const defaultChecklist = {
      camera_ready: false,
      batteries_ready: false,
      memory_card_ready: false,
      photos_transferred: false,
      photos_organized: false,
      photos_edited: false,
      uploaded_to_drive: false,
      drive_link_added: false
    };

    const checklistLabels = {
      camera_ready: 'Camera ready',
      batteries_ready: 'Batteries ready',
      memory_card_ready: 'Memory card ready',
      photos_transferred: 'Photos transferred',
      photos_organized: 'Photos organized',
      photos_edited: 'Photos edited',
      uploaded_to_drive: 'Uploaded to Google Drive',
      drive_link_added: 'Google Drive link added'
    };

    function escapeHtml(value = '') {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function normalizeChecklist(checklist) {
      return { ...defaultChecklist, ...(checklist || {}) };
    }

    function checklistProgress(event) {
      const c = normalizeChecklist(event.checklist);
      const values = Object.values(c);
      const done = values.filter(Boolean).length;
      return { done, total: values.length };
    }

    function isBackedUp(event) {
      return event.status === 'Backed Up' || event.status === 'Delivered';
    }

    function formatDate(dateString) {
      if (!dateString) return 'No date';
      const d = new Date(dateString + 'T00:00:00');
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatTime(timeString) {
      if (!timeString) return '';
      const [h, m] = timeString.split(':');
      const d = new Date();
      d.setHours(Number(h), Number(m), 0, 0);
      return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }

    function setTimePicker(timeString) {
      const hour = document.getElementById('timeHour');
      const minute = document.getElementById('timeMinute');
      const period = document.getElementById('timePeriod');
      const hidden = document.getElementById('shootTime');

      hour.value = '';
      minute.value = '';
      period.value = '';
      hidden.value = timeString || '';

      if (!timeString) return;

      const [rawHour, rawMinute] = timeString.split(':').map(Number);
      if (Number.isNaN(rawHour) || Number.isNaN(rawMinute)) return;

      const p = rawHour >= 12 ? 'PM' : 'AM';
      let h = rawHour % 12;
      if (h === 0) h = 12;

      hour.value = String(h).padStart(2, '0');
      minute.value = String(rawMinute).padStart(2, '0');
      period.value = p;
    }

    function syncTimePicker() {
      const hour = document.getElementById('timeHour').value;
      const minute = document.getElementById('timeMinute').value;
      const period = document.getElementById('timePeriod').value;
      const hidden = document.getElementById('shootTime');

      if (!hour || !minute || !period) {
        hidden.value = '';
        return;
      }

      let h = Number(hour);
      if (period === 'AM' && h === 12) h = 0;
      if (period === 'PM' && h !== 12) h += 12;

      hidden.value = `${String(h).padStart(2, '0')}:${minute}`;
    }

    ['timeHour', 'timeMinute', 'timePeriod'].forEach(id => {
      document.getElementById(id).addEventListener('change', syncTimePicker);
    });

    function statusBadge(status) {
      if (status === 'Shot') {
        return `<span class="text-[10px] px-2.5 py-1 rounded-full bg-white text-black font-bold uppercase tracking-wider">⚠️ Needs Backup</span>`;
      }
      if (status === 'Backup In Progress') {
        return `<span class="text-[10px] px-2.5 py-1 rounded-full bg-white/10 text-zinc-200 border border-white/10">⏳ In Progress</span>`;
      }
      if (status === 'Backed Up') {
        return `<span class="text-[10px] px-2.5 py-1 rounded-full bg-white/10 text-zinc-200 border border-white/10">✓ Backed Up</span>`;
      }
      return `<span class="text-[10px] px-2.5 py-1 rounded-full bg-white/5 text-zinc-400 border border-white/10">📦 Delivered</span>`;
    }

    async function fetchEvents() {
      const startTime = Date.now();

      const { data, error } = await _supabase
        .from('events')
        .select('*')
        .order('shoot_date', { ascending: false });

      const elapsedTime = Date.now() - startTime;
      const remainingTime = Math.max(0, 1200 - elapsedTime);

      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        if (splash) {
          splash.classList.add('opacity-0', 'pointer-events-none');
          setTimeout(() => splash.remove(), 700);
        }
      }, remainingTime);

      if (error) {
        alert('Error fetching events: ' + error.message);
        return;
      }

      allEvents = (data || []).map(e => ({
        ...e,
        checklist: normalizeChecklist(e.checklist)
      }));

      updateDashboardStats();
      renderNextEvent();
      renderEvents();
      renderRecentEvents();
    }

    function updateDashboardStats() {
      const total = allEvents.length;
      const pending = allEvents.filter(e => !isBackedUp(e)).length;
      const backedUp = allEvents.filter(isBackedUp).length;

      document.getElementById('statTotal').innerText = total;
      document.getElementById('statPending').innerText = pending;
      document.getElementById('statBackedUp').innerText = backedUp;
    }

    function setFilter(filter) {
      currentFilter = filter;

      ['all', 'needs_backup', 'upcoming', 'past'].forEach(tab => {
        const btn = document.getElementById(`tab-${tab}`);
        if (tab === filter) {
          btn.className = 'pb-3 text-white border-b-2 border-white whitespace-nowrap';
        } else {
          btn.className = 'pb-3 text-zinc-500 hover:text-zinc-300 whitespace-nowrap';
        }
      });

      renderEvents();
    }

    function matchesSearch(event) {
      if (!searchTerm) return true;

      const haystack = [
        event.title,
        event.event_type,
        event.location,
        event.organization,
        event.notes
      ].filter(Boolean).join(' ').toLowerCase();

      return haystack.includes(searchTerm.toLowerCase());
    }

    function renderEvents() {
      const today = new Date().toISOString().split('T')[0];

      let filtered = allEvents.filter(event => {
        if (!matchesSearch(event)) return false;

        if (currentFilter === 'needs_backup') {
          return !isBackedUp(event);
        }

        if (currentFilter === 'upcoming') {
          return event.shoot_date >= today;
        }

        if (currentFilter === 'past') {
          return event.shoot_date < today && isBackedUp(event);
        }

        return true;
      });

      if (currentFilter === 'upcoming') {
        filtered.sort((a, b) => {
          const ad = `${a.shoot_date}T${a.shoot_time || '23:59'}`;
          const bd = `${b.shoot_date}T${b.shoot_time || '23:59'}`;
          return ad.localeCompare(bd);
        });
      }

      if (filtered.length === 0) {
        eventsList.innerHTML = `
          <div class="glass rounded-3xl text-center py-12">
            <div class="text-2xl opacity-40 mb-2">⌁</div>
            <p class="text-zinc-600 text-xs tracking-[.18em] uppercase">No matching events found</p>
          </div>`;
        return;
      }

      eventsList.innerHTML = '';

      filtered.forEach((event, index) => {
        const card = document.createElement('div');
        const progress = checklistProgress(event);

        card.className = 'animate-fade-in glass rounded-3xl p-4 md:p-5 transition-all duration-300 hover:border-white/20 hover:bg-white/[.06] cursor-pointer';
        card.style.animationDelay = `${index * 35}ms`;

        const cover = event.cover_url
          ? `<img src="${escapeHtml(event.cover_url)}" alt="" class="w-16 h-16 md:w-20 md:h-20 rounded-2xl object-cover border border-white/10 shrink-0">`
          : `<div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl glass-soft shrink-0 flex items-center justify-center text-xl text-zinc-600">📷</div>`;

        const time = formatTime(event.shoot_time);
        const meta = [
          `📅 ${formatDate(event.shoot_date)}`,
          time ? `🕐 ${time}` : '',
          event.location ? `📍 ${escapeHtml(event.location)}` : ''
        ].filter(Boolean).join(' <span class="text-zinc-700 mx-1">•</span> ');

        card.innerHTML = `
          <div class="flex flex-col md:flex-row md:items-center gap-4">
            ${cover}

            <div class="min-w-0 flex-1">
              <div class="flex items-start gap-2 flex-wrap">
                <h3 class="font-medium text-white tracking-wide">${escapeHtml(event.title)}</h3>
                ${statusBadge(event.status)}
              </div>

              <p class="text-[11px] text-zinc-500 mt-1">${meta}</p>

              <div class="flex flex-wrap items-center gap-2 mt-3">
                <span class="text-[10px] px-2 py-1 rounded-lg glass-soft text-zinc-400">
                  ${escapeHtml(event.event_type || 'School Activity')}
                </span>
                <span class="text-[10px] px-2 py-1 rounded-lg glass-soft text-zinc-500">
                  Checklist ${progress.done}/${progress.total}
                </span>
                ${event.organization ? `<span class="text-[10px] px-2 py-1 rounded-lg glass-soft text-zinc-500">${escapeHtml(event.organization)}</span>` : ''}
              </div>
            </div>

            <div class="flex md:flex-col items-center md:items-stretch gap-2 shrink-0" onclick="event.stopPropagation()">
              <a href="${escapeHtml(event.drive_url || '#')}" target="_blank" rel="noopener noreferrer"
                class="bg-white hover:bg-zinc-200 text-black text-[11px] font-semibold px-3 py-2 rounded-xl text-center transition active:scale-[.98]">
                Drive ↗
              </a>
              <button onclick="editEvent('${event.id}')"
                class="glass-soft hover:bg-white/10 text-zinc-300 text-[11px] px-3 py-2 rounded-xl transition">
                Edit
              </button>
            </div>
          </div>
        `;

        card.addEventListener('click', () => openEventDetails(event.id));
        eventsList.appendChild(card);
      });
    }

    function renderNextEvent() {
      const today = new Date().toISOString().split('T')[0];

      const upcoming = allEvents
        .filter(e => e.shoot_date >= today)
        .sort((a, b) => {
          const ad = `${a.shoot_date}T${a.shoot_time || '23:59'}`;
          const bd = `${b.shoot_date}T${b.shoot_time || '23:59'}`;
          return ad.localeCompare(bd);
        });

      const panel = document.getElementById('nextEventPanel');

      if (!upcoming.length) {
        panel.classList.add('hidden');
        return;
      }

      const event = upcoming[0];
      panel.classList.remove('hidden');

      document.getElementById('nextEventTitle').innerText = event.title;
      document.getElementById('nextEventMeta').innerText =
        `${formatDate(event.shoot_date)}${event.shoot_time ? ' • ' + formatTime(event.shoot_time) : ''}${event.location ? ' • ' + event.location : ''}`;

      document.getElementById('nextEventBtn').onclick = () => openEventDetails(event.id);
    }

    function renderRecentEvents() {
      const panel = document.getElementById('recentPanel');
      const container = document.getElementById('recentEvents');

      const recent = [...allEvents]
        .sort((a, b) => `${b.shoot_date}T${b.shoot_time || '00:00'}`.localeCompare(`${a.shoot_date}T${a.shoot_time || '00:00'}`))
        .slice(0, 4);
z
      if (!recent.length) {
        panel.classList.add('hidden');
        return;
      }

      panel.classList.remove('hidden');

      container.innerHTML = recent.map(event => `
        <button onclick="openEventDetails('${event.id}')" class="glass rounded-2xl p-4 text-left hover:bg-white/[.06] transition">
          <div class="flex items-center justify-between gap-3">
            <span class="text-sm text-white truncate">${escapeHtml(event.title)}</span>
            ${statusBadge(event.status)}
          </div>
          <p class="text-[10px] text-zinc-500 mt-2">${formatDate(event.shoot_date)}${event.location ? ' • ' + escapeHtml(event.location) : ''}</p>
        </button>
      `).join('');
    }

    function openEventDetails(id) {
      const event = allEvents.find(e => e.id === id);
      if (!event) return;

      const c = normalizeChecklist(event.checklist);
      const progress = checklistProgress(event);

      const checklistHtml = Object.entries(checklistLabels).map(([key, label]) => `
        <label class="flex items-center gap-3 p-3 rounded-xl glass-soft cursor-pointer hover:bg-white/[.06] transition">
          <input type="checkbox" ${c[key] ? 'checked' : ''}
            onchange="toggleChecklist('${event.id}', '${key}', this.checked)"
            class="w-4 h-4 accent-white">
          <span class="text-xs ${c[key] ? 'text-zinc-300 line-through' : 'text-zinc-400'}">${label}</span>
        </label>
      `).join('');

      const cover = event.cover_url
        ? `<img src="${escapeHtml(event.cover_url)}" alt="" class="w-full h-44 object-cover rounded-2xl border border-white/10 mb-5">`
        : '';

      document.getElementById('modalContent').innerHTML = `
        <div class="p-5 md:p-6">
          <div class="flex items-start justify-between gap-4 mb-5">
            <div>
              <p class="text-[9px] uppercase tracking-[.2em] text-zinc-500 mb-2">Event Details</p>
              <h2 class="text-2xl font-light">${escapeHtml(event.title)}</h2>
              <div class="mt-2">${statusBadge(event.status)}</div>
            </div>
            <button onclick="closeEventDetails()" class="glass-soft w-9 h-9 rounded-xl text-zinc-400 hover:text-white transition">×</button>
          </div>

          ${cover}

          <div class="grid grid-cols-2 gap-3 mb-5">
            <div class="glass-soft rounded-2xl p-3">
              <p class="text-[9px] uppercase tracking-wider text-zinc-600">Date</p>
              <p class="text-xs text-zinc-300 mt-1">${formatDate(event.shoot_date)}</p>
            </div>
            <div class="glass-soft rounded-2xl p-3">
              <p class="text-[9px] uppercase tracking-wider text-zinc-600">Time</p>
              <p class="text-xs text-zinc-300 mt-1">${formatTime(event.shoot_time) || 'Not set'}</p>
            </div>
            <div class="glass-soft rounded-2xl p-3">
              <p class="text-[9px] uppercase tracking-wider text-zinc-600">Location</p>
              <p class="text-xs text-zinc-300 mt-1">${escapeHtml(event.location || 'Not set')}</p>
            </div>
            <div class="glass-soft rounded-2xl p-3">
              <p class="text-[9px] uppercase tracking-wider text-zinc-600">Department</p>
              <p class="text-xs text-zinc-300 mt-1">${escapeHtml(event.organization || 'Not set')}</p>
            </div>
          </div>

          <div class="glass-soft rounded-2xl p-4 mb-5">
            <div class="flex items-center justify-between mb-3">
              <div>
                <p class="text-[9px] uppercase tracking-[.18em] text-zinc-500">Event Checklist</p>
                <p class="text-xs text-zinc-300 mt-1">${progress.done} / ${progress.total} completed</p>
              </div>
              <div class="w-24 h-1.5 bg-white/10 rounded-full overflow-hidden">
                <div class="h-full bg-white rounded-full" style="width:${(progress.done / progress.total) * 100}%"></div>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
              ${checklistHtml}
            </div>
          </div>

          <div class="glass-soft rounded-2xl p-4 mb-5">
            <p class="text-[9px] uppercase tracking-[.18em] text-zinc-500 mb-2">Google Drive</p>
            <a href="${escapeHtml(event.drive_url || '#')}" target="_blank" rel="noopener noreferrer"
              class="inline-flex bg-white text-black hover:bg-zinc-200 px-4 py-2.5 rounded-xl text-xs font-semibold transition">
              Open Google Drive ↗
            </a>
          </div>

          ${event.notes ? `
            <div class="glass-soft rounded-2xl p-4 mb-5">
              <p class="text-[9px] uppercase tracking-[.18em] text-zinc-500 mb-2">Notes</p>
              <p class="text-xs text-zinc-400 whitespace-pre-wrap">${escapeHtml(event.notes)}</p>
            </div>` : ''}

          <div class="flex items-center gap-3">
            <button onclick="editEvent('${event.id}'); closeEventDetails();" class="flex-1 bg-white hover:bg-zinc-200 text-black text-xs font-semibold py-3 rounded-xl transition">
              Edit Event
            </button>
            <button onclick="deleteEvent('${event.id}')" class="glass-soft hover:bg-red-500/20 text-red-400 text-xs px-4 py-3 rounded-xl transition">
              Delete
            </button>
          </div>
        </div>
      `;

      document.getElementById('eventModal').classList.remove('hidden');
      document.getElementById('eventModal').classList.add('flex');
    }

    function closeEventDetails() {
      const modal = document.getElementById('eventModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function toggleChecklist(id, key, checked) {
      const event = allEvents.find(e => e.id === id);
      if (!event) return;

      const updatedChecklist = { ...event.checklist, [key]: checked };
      const { error } = await _supabase
        .from('events')
        .update({ checklist: updatedChecklist })
        .eq('id', id);

      if (error) {
        alert('Error updating checklist: ' + error.message);
        return;
      }

      event.checklist = updatedChecklist;
      renderEvents();
      openEventDetails(id);
    }

    function editEvent(id) {
      const event = allEvents.find(e => e.id === id);
      if (!event) return;

      editingId = event.id;
      document.getElementById('formHeading').innerText = 'Edit Event';
      document.getElementById('submitBtn').innerText = 'Update Event';
      document.getElementById('cancelEditBtn').classList.remove('hidden');

      document.getElementById('title').value = event.title || '';
      document.getElementById('eventType').value = event.event_type || 'School Activity';
      document.getElementById('shootDate').value = event.shoot_date || '';
      setTimePicker(event.shoot_time);
      document.getElementById('location').value = event.location || '';
      document.getElementById('organization').value = event.organization || '';
      document.getElementById('status').value = event.status || 'Backed Up';
      document.getElementById('driveUrl').value = event.drive_url || '';
      document.getElementById('coverUrl').value = event.cover_url || '';
      document.getElementById('notes').value = event.notes || '';

      window.scrollTo({ top: document.getElementById('eventForm').offsetTop - 20, behavior: 'smooth' });
    }

    function resetForm() {
      editingId = null;
      form.reset();
      setTimePicker('');
      document.getElementById('formHeading').innerText = 'Log New Event';
      document.getElementById('submitBtn').innerText = 'Save to ShotLog';
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    async function deleteEvent(id) {
      if (!confirm('Are you sure you want to delete this event?')) return;
      const { error } = await _supabase.from('events').delete().eq('id', id);
      if (error) {
        alert('Error deleting event: ' + error.message);
        return;
      }
      closeEventDetails();
      fetchEvents();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      syncTimePicker();

      const payload = {
        title: document.getElementById('title').value,
        event_type: document.getElementById('eventType').value,
        shoot_date: document.getElementById('shootDate').value,
        shoot_time: document.getElementById('shootTime').value || null,
        location: document.getElementById('location').value,
        organization: document.getElementById('organization').value,
        status: document.getElementById('status').value,
        drive_url: document.getElementById('driveUrl').value,
        cover_url: document.getElementById('coverUrl').value,
        notes: document.getElementById('notes').value
      };

      if (editingId) {
        const { error } = await _supabase
          .from('events')
          .update(payload)
          .eq('id', editingId);
        if (error) { alert('Error updating event: ' + error.message); return; }
      } else {
        payload.checklist = defaultChecklist;
        const { error } = await _supabase
          .from('events')
          .insert([payload]);
        if (error) { alert('Error creating event: ' + error.message); return; }
      }

      resetForm();
      fetchEvents();
    });

    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');

    searchInput.addEventListener('input', (e) => {
      searchTerm = e.target.value;
      if (searchTerm) {
        clearSearch.classList.remove('hidden');
      } else {
        clearSearch.classList.add('hidden');
      }
      renderEvents();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      searchTerm = '';
      clearSearch.classList.add('hidden');
      renderEvents();
    });

    // Google Auth Handlers
    async function signInWithGoogle() {
      const { error } = await _supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin
        }
      });
      if (error) alert('Sign in error: ' + error.message);
    }

    async function signOut() {
      await _supabase.auth.signOut();
    }

    _supabase.auth.onAuthStateChange((event, session) => {
      const loginCard = document.getElementById('loginCard');
      const splash = document.getElementById('splashScreen');

      if (session) {
        if (loginCard) loginCard.classList.add('hidden');
        fetchEvents();
      } else {
        if (loginCard) loginCard.classList.remove('hidden');
        if (splash) splash.remove();
      }
    });
  </script>
</body>
</html>
